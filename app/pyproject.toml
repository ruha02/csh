[project]
name = "csh"
version = "0.1.0"
description = "Сервис оптимальной трассировки инженерных сетей"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg (>=3.3.6,<4.0.0)",
    "jwt (>=1.4.0,<2.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [".*"]


[tool.ruff]
line-length = 88 
target-version = "py314" 

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double" 

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]